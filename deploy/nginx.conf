# nginx for all Chrae Lab hosts — mounted as /etc/nginx/conf.d/default.conf in
# the fin_plan container (see DEPLOY.md). Traefik terminates TLS and forwards
# every host below to this one container; nginx picks the site by Host.
#
#   fire.chraegames.cloud   → dist/fire
#   games.chraegames.cloud  → dist/games
#   tools.chraegames.cloud  → dist/tools
#   chraegames.cloud, www., fireplan.  → 301 to the new URL (map below), except
#                                        /migrate.html + /robots.txt (dist/legacy)
#
# scripts/nginx.test.ts replays every pre-split URL through the $legacy_target
# map and checks it lands on that page's new canonical URL — keep it passing
# when you add or move a page.

map $host $site_dir {
    fire.chraegames.cloud   fire;
    games.chraegames.cloud  games;
    tools.chraegames.cloud  tools;
}

# Old single-origin URL → new home. Captures keep the rest of the path and the
# query string. First matching regex wins, so order matters.
map $request_uri $legacy_target {
    ~^/fire-planner/?(?<rest>[?].*)?$                                          https://fire.chraegames.cloud/$rest;
    ~^/fire-planner/(?<rest>.+)$                                               https://fire.chraegames.cloud/$rest;
    ~^/(?<rest>(sudoku|bingo|go|magic-tower|city)([/?].*)?)$                   https://games.chraegames.cloud/$rest;
    ~^/(?<rest>(unit-converter|calculator|todo|tv-guide)([/?].*)?)$           https://tools.chraegames.cloud/$rest;
    # The old hub (and anything unknown) goes to the tools landing, the closest match.
    default                                                                    https://tools.chraegames.cloud/;
}

# Shared by the three sites.
server {
    listen 80;
    server_name fire.chraegames.cloud games.chraegames.cloud tools.chraegames.cloud;
    root /usr/share/nginx/html/$site_dir;
    index index.html;

    # Directory redirects (/sudoku → /sudoku/) must stay relative; nginx sits
    # behind Traefik and doesn't know the public scheme/host.
    absolute_redirect off;

    # Vite hashes asset filenames → cache them forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /some/page/index.html is the same document as /some/page/ — collapse the
    # duplicate so crawlers only ever see the canonical form. This must test
    # $request_uri (what the client asked for): the `index` directive internally
    # re-requests /page/index.html, and a `location` regex would match that
    # internal request too and 301 every page to itself.
    if ($request_uri ~ ^([^?]*/)index\.html(\?|$)) {
        return 301 $1;
    }

    # Multi-page site, not an SPA: unknown paths are a real 404 (a soft 404
    # wastes crawl budget and confuses Search Console).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml+rss image/svg+xml;
}

# The old single-origin site. Every page 301s to its new home; only the
# storage bridge (framed by the new sites) and robots.txt are still served.
server {
    listen 80;
    server_name chraegames.cloud www.chraegames.cloud fireplan.chraegames.cloud;
    root /usr/share/nginx/html/legacy;

    location = /migrate.html {
        add_header Content-Security-Policy "frame-ancestors https://fire.chraegames.cloud https://games.chraegames.cloud https://tools.chraegames.cloud";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        # fireplan. predates /fire-planner/: its paths are already fire-site paths.
        if ($host = fireplan.chraegames.cloud) {
            return 301 https://fire.chraegames.cloud$request_uri;
        }
        return 301 $legacy_target;
    }
}

# Anything else that reaches this container (unknown Host).
server {
    listen 80 default_server;
    return 444;
}
